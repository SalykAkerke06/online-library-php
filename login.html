<!doctype html>
<html lang="kk">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Кіру | Онлайн кітапхана</title>
		<link rel="stylesheet" href="css/style.css" />
	</head>
	<body>
		<h1>Онлайн кітапхана</h1>

		<nav>
			<a href="index.html">Басты бет</a>
			<a href="books.html">Кітаптар</a>
			<a href="login.html">Кіру</a>
			<a href="register.html">Тіркелу</a>
		</nav>

		<h2>Жүйеге кіру</h2>

		<form class="auth-form" id="loginForm">
			<label for="email">Email:</label>
			<input
				type="email"
				id="email"
				name="email"
				placeholder="Email енгізіңіз"
				required
			/>

			<label for="password">Құпиясөз:</label>
			<input
				type="password"
				id="password"
				name="password"
				placeholder="Құпиясөз енгізіңіз"
				required
			/>

			<button type="submit">Кіру</button>
		</form>

		<p>
			Аккаунтыңыз жоқ па?
			<a href="register.html">Тіркелу</a>
		</p>

		<script>
			document
				.getElementById('loginForm')
				.addEventListener('submit', function (event) {
					event.preventDefault()
					alert('Бұл әзірге демо-нұсқа. Кіру жүйесі кейін қосылады.')
				})
		</script>
	</body>
</html>
